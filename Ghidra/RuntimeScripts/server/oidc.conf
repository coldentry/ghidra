#
# OpenID Connect (OIDC) configuration file for GhidraServer when operating in -a3 mode.
#
# Enable by adding the following server.conf parameters (renumbering as needed):
#     wrapper.app.parameter.1=-a3
#     wrapper.app.parameter.2=-oidc
#     wrapper.app.parameter.3=oidc.conf
#
# Ghidra clients authenticate using the OAuth 2.0 Authorization Code flow with PKCE.  The client
# opens a web browser (or prints a URL when running headless) and receives the identity provider
# redirect on a loopback (http://127.0.0.1:<port>/oidc/callback) listener.  The resulting ID token
# is validated by the server (signature, issuer, audience, expiration and a single-use nonce
# issued by the server).
#
# The identity provider client must be registered as a PUBLIC client (no client secret) since
# the token exchange is performed by each Ghidra client.  The redirect URI to be registered is:
#
#     http://127.0.0.1:<redirect_port>/oidc/callback
#
# This file uses Java properties syntax.  Lines beginning with '#' are comments.  See the
# "OpenID Connect" section of svrREADME.md for complete identity provider setup instructions.
#

#----------------------------------------------------------------------------------------------
# Required settings
#----------------------------------------------------------------------------------------------

# OIDC issuer identifier.  This must exactly match the "issuer" value published by the identity
# provider at <issuer>/.well-known/openid-configuration.  https is required.
#
#   Microsoft Entra ID:  https://login.microsoftonline.com/<tenant-id>/v2.0
#                        (multi-tenant "common"/"organizations" issuers are not supported)
#   Keycloak:            https://<keycloak-host>/realms/<realm-name>
#
#issuer=https://login.microsoftonline.com/00000000-0000-0000-0000-000000000000/v2.0

# OAuth client ID registered with the identity provider.
#   Microsoft Entra ID:  Application (client) ID of the app registration
#   Keycloak:            Client ID of the client
#
#client_id=ghidra-server

#----------------------------------------------------------------------------------------------
# Optional settings (defaults shown)
#----------------------------------------------------------------------------------------------

# Space-separated list of scopes requested by the client ('openid' is required).
#scopes=openid profile email

# Required ID token audience ("aud" claim).  Defaults to client_id.
#audience=

# Name of the ID token claim which provides the Ghidra user name.  Nested claims may be
# referenced using a dotted path (e.g., realm_access.roles).
#   Microsoft Entra ID:  preferred_username is the user principal name (e.g., alice@contoso.com)
#   Keycloak:            preferred_username is the Keycloak username
#username_claim=preferred_username

# If true, any '@domain' suffix is removed from the user name claim (alice@contoso.com -> alice).
# Ghidra user names may only contain letters, digits, '.', '-' and '_'.
#strip_domain=true

# If true, the user name is converted to lower-case.
#lowercase_username=true

# Comma-separated list of permitted user name domains (the portion following '@' in the
# username_claim value, checked before strip_domain is applied).  If specified, users without
# a matching domain are rejected.  Default: any domain.
#allowed_domains=contoso.com

# Optionally require that a claim (e.g., group or role membership) contain at least one of the
# listed values.  The claim may be a string or an array of strings.
#   Microsoft Entra ID app roles:   required_claim=roles
#                                   required_claim_values=Ghidra.User
#   Keycloak realm roles:           required_claim=realm_access.roles
#   (requires "Add to ID token")    required_claim_values=ghidra-user
#   Keycloak groups:                required_claim=groups
#   (Group Membership mapper)       required_claim_values=ghidra-users
#required_claim=
#required_claim_values=

# Loopback redirect port which clients should listen on.  0 allows the client to choose any
# available port, which is suitable for Microsoft Entra ID (which ignores the port of loopback
# redirect URIs).  Keycloak requires the registered redirect URI port to match, so a fixed port
# should be specified.  Clients may override this with -Dghidra.oidc.redirect.port=<port>, for
# example when forwarding the port over SSH for headless use.
#redirect_port=0

# Additional authorization request parameters (URL query syntax), e.g.,
#   prompt=select_account          (always show account picker)
#   domain_hint=contoso.com        (Entra ID home realm hint)
#auth_params=

# Comma-separated list of permitted ID token signature algorithms.
# Supported: RS256, RS384, RS512, PS256, PS384, PS512, ES256, ES384, ES512
#allowed_algorithms=RS256,RS384,RS512,PS256,PS384,PS512,ES256,ES384,ES512

# Allowed clock skew (seconds) when validating ID token times.
#clock_skew_seconds=120

# Time allowed (seconds) for a user to complete sign-in with the identity provider.
#login_timeout_seconds=300
